name: Deploy to Cloud Run

on:
  push:
    branches: [main]
  workflow_dispatch:

# Least privilege: read the repo, and mint an OIDC token for Workload
# Identity Federation. No long-lived Google credential is stored anywhere.
permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-main
  cancel-in-progress: false

env:
  SERVICE: garmlink
  REGION: us-central1

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      # A real install, so packaging breakage fails here rather than in
      # Cloud Build (release v1 failed exactly that way).
      - name: Install
        run: pip install -e .

      - name: Contract test — every client.call site matches garminconnect
        run: python tests/test_garmin_contract.py

      - name: Auth, cache, and write-bypass behaviour
        run: |
          python tests/test_critical_fixes.py
          python tests/test_auth_lifecycle.py

      # The allowlist is the whole of the access control after the OAuth
      # cutover: GitHubTokenVerifier accepts any token minted for our app, so
      # without this the fail-closed config and the public route surface are
      # unprotected in CI.
      - name: OAuth allowlist, fail-closed config, and public route surface
        run: python tests/test_auth_provider.py

      - name: Tool dispatch through the mounted routers
        env:
          GARMIN_EMAIL: test@example.invalid
          ALLOW_UNAUTHENTICATED: '1'
        run: python tests/test_tool_dispatch.py

      - name: Coaching prompts
        env:
          GARMIN_EMAIL: test@example.invalid
          ALLOW_UNAUTHENTICATED: '1'
        run: python tests/test_prompts.py

      - name: Logging and redaction
        env:
          GARMIN_EMAIL: test@example.invalid
          ALLOW_UNAUTHENTICATED: '1'
        run: python tests/test_logging.py

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}

      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy "$SERVICE" \
            --source . \
            --region "$REGION" \
            --project "${{ vars.GCP_PROJECT_ID }}" \
            --allow-unauthenticated \
            --min-instances=0 \
            --max-instances=2 \
            --memory=512Mi \
            --cpu=1 \
            --timeout=3600 \
            --set-secrets=GARMIN_EMAIL=GARMIN_EMAIL:latest,GARMIN_TOKENS_JSON=GARMIN_TOKENS_JSON:latest,GITHUB_CLIENT_ID=GITHUB_CLIENT_ID:latest,GITHUB_CLIENT_SECRET=GITHUB_CLIENT_SECRET:latest,READYZ_TOKEN=READYZ_TOKEN:latest \
            --set-env-vars=PUBLIC_BASE_URL=https://garmlink-moz6szqd6q-uc.a.run.app,GITHUB_ALLOWED_USERS=knahsirV \
            --quiet

      - name: Show service URL
        run: |
          gcloud run services describe "$SERVICE" \
            --region "$REGION" \
            --project "${{ vars.GCP_PROJECT_ID }}" \
            --format='value(status.url)'
