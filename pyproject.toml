[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "garmlink"
version = "0.1.0"
# garminconnect 0.3.3+ requires 3.12. Claiming 3.11 support meant pip silently
# resolved to garminconnect 0.3.2 locally while CI and the Docker image (both
# 3.12) got 0.3.11 — the same constraint yielding two different libraries.
requires-python = ">=3.12"
dependencies = [
    # Exact pin: this is a 0.x library that has already broken this project
    # twice — a login() signature change (a87bf69) and get_training_readiness
    # switching from dict to list between 0.3.2 and 0.3.11.
    "garminconnect==0.3.11",
    "fastmcp>=3.4,<4",
    "python-dotenv>=1.0",
    "uvicorn>=0.30",
    # OAuth state (DCR registrations, refresh-token mappings) must outlive a
    # cold start: this service scales to zero and the default store is a file
    # tree on ephemeral local disk. Pinned exactly — a floating dep already
    # resolved to two different libraries on two Pythons once on this project.
    "google-cloud-firestore==2.28.1",
    # auth_provider.py imports key_value.aio.protocols and
    # key_value.aio.stores.firestore directly and relies on FirestoreStore's
    # `project=`/`default_collection=` constructor keywords, but this only ever
    # arrived transitively through fastmcp>=3.4,<4. It is a 0.x library that
    # self-declares as unstable, so it is a direct, exactly-pinned dependency
    # here rather than left to whatever fastmcp happens to drag in. The
    # `[firestore]` extra's own google-cloud-firestore requirement is a
    # floating `>=2.13.0`, not an exact pin, so it does not subsume the pin
    # above — both are kept.
    "py-key-value-aio[firestore]==0.4.5",
]

[project.scripts]
garmlink = "garmlink.server:main"
garmlink-auth = "garmlink.auth:main"

[tool.hatch.build.targets.wheel]
packages = ["src/garmlink"]
